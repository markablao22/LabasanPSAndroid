name: Build Labasan PS and Meter Monitoring APKs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APKs
        run: gradle --no-daemon assembleDebug

      - name: Upload original Water Elevation APK
        uses: actions/upload-artifact@v4
        with:
          name: LabasanPS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Meter Monitoring APK
        uses: actions/upload-artifact@v4
        with:
          name: MeterMonitoring-debug-apk
          path: meterapp/build/outputs/apk/debug/meterapp-debug.apk
          if-no-files-found: error
          retention-days: 14
